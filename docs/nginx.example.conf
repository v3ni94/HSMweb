# Beispielkonfiguration für nginx + PHP-FPM, falls kein Apache verfügbar ist. Pfade anpassen. Nicht getestet.
server {
    listen 443 ssl http2;
    server_name hsm-tec.de;
    root /var/www/hsm-tec/public;
    index index.php;

    # ssl_certificate ...; ssl_certificate_key ...;

    add_header X-Content-Type-Options "nosniff" always;

    # Versteckte Dateien und Quellartefakte sperren
    location ~ /\.(?!well-known/) { return 404; }
    location ~ \.(lock|md|dist|bak|sql|log|sh|ini)$ { return 404; }

    # Öffentliche Datenexporte ausdrücklich erlauben, alle anderen JSON sperren
    location ~ ^/assets/data/[a-z0-9-]+\.json$ { expires 1h; try_files $uri =404; }
    location ~ \.json$ { return 404; }

    location ~* \.(css|js|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
    # Keine anderen PHP-Dateien ausführen
    location ~ \.php$ { return 404; }

    client_max_body_size 12m;
}

server {
    listen 80;
    server_name hsm-tec.de www.hsm-tec.de;
    return 301 https://hsm-tec.de$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.hsm-tec.de;
    return 301 https://hsm-tec.de$request_uri;
}
